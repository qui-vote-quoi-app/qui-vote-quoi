name: Demandes (retraits et signalements)

# Traitement automatique des formulaires « Demander un retrait » et « Signaler une erreur ».
# Le contenu de l'issue est lu par Python depuis l'événement : il n'est jamais inséré dans une commande shell.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: qui-vote-quoi
  cancel-in-progress: false

jobs:
  demande:
    if: contains(github.event.issue.labels.*.name, 'retrait') || contains(github.event.issue.labels.*.name, 'erreur')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployer: ${{ steps.pipeline.outputs.deployer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # dernière version au démarrage (un passage précédent a pu pousser entre-temps)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Lire la demande et appliquer le retrait
        id: demande
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python -m pipeline.demandes

      - name: Enregistrer
        if: steps.demande.outputs.publier == 'true'
        run: |
          git config user.name "qui-vote-quoi[bot]"
          git config user.email "qui-vote-quoi@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Retrait automatique (demande #${{ github.event.issue.number }})"
          git pull --rebase --autostash -X theirs origin main
          git push

      - name: Réutiliser les fichiers déjà téléchargés
        if: steps.demande.outputs.publier == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-

      - name: Reconstruire le site sans le contenu retiré
        id: pipeline
        if: steps.demande.outputs.publier == 'true'
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          TELEGRAM_CANAL: ""
          QVQ_PHOTOS: ${{ vars.QVQ_PHOTOS }}
        run: python -m pipeline.run --mode publier

      - if: steps.pipeline.outputs.deployer == 'true'
        run: |
          V=$(git rev-parse --short HEAD)
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$V\"#; s#src=\"app.js\"#src=\"app.js?v=$V\"#; s#content=\"dev\"#content=\"$V\"#" site/index.html
          echo "$V" > site/version.txt
      - if: steps.pipeline.outputs.deployer == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: demande
    if: needs.demande.outputs.deployer == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
